<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Firefox Workspace for Codex</title>
    <link rel="stylesheet" href="popup.css">
    <script defer src="popup.js"></script>
  </head>
  <body>
    <main>
      <h1>Firefox workspace</h1>
      <p id="status" role="status">Checking connection…</p>
      <button id="connection" type="button" disabled>Connect Codex</button>
      <button id="retry" type="button" hidden>Retry connection</button>
      <p id="message" role="status"></p>
      <section id="permissions" hidden aria-labelledby="sites-title">
        <h2 id="sites-title">Site access</h2>
        <ul id="sites"></ul>
      </section>
    </main>
  </body>
</html>
